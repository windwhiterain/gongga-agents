# 缓存保留时间。官方只说"几个小时到几天"，而且明确是尽力而为 —— 没有可配的 TTL 旋钮，
# 命不命中由系统判定，所以也不要把它写进任何 SLA。
cache_ttl = "几小时到几天 —— 官方原文：缓存不再使用后会自动被清空，时间一般为几个小时到几天"
cache_ttl_note = "官方口径是『尽力而为』，不保证 100% 命中，文档里也没有 TTL 参数。定价页只有 cache_read 一档，没有写入价与存储价 —— 估计写入与存储不另收费，是从价目表缺项推的，未向官方确认。"
cache_ttl_source = "https://api-docs.deepseek.com/zh-cn/guides/kv_cache"
cache_ttl_retrieved = "2026-11-01"
cache_ttl_estimate = "Agent 流量约 3 天，聊天流量约 7 天（按流量类型分，不是按模型）"
cache_ttl_estimate_basis = "community"          # community：第三方实测/横评; inferred：按官方机制推出; guess：纯猜
cache_ttl_estimate_source = "https://cloud.tencent.cn/developer/article/2765995 —— 转述 DeepInfer 开源推理框架的工程文档，不是 API 承诺；实测命中率 96% 也出自同一份文档"


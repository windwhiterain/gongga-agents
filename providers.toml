  source = "https://platform.qianwenai.com/docs/token-plan/personal/token-plan-personal-overview"
  quota_note = "官方余量查询是 `bl usage token-plan`（CLI 控制台鉴权）或 OpenAPI GetSubscriptionStats（AccessKey 签名），都没有 sk- 可用的路径"

  # 读取顺序：控制台会话在前，签名的 OpenAPI 在后。
  # 2026-11-15 实测：GetSubscriptionStats 只统计「席位」（SeatCredits / SeatRemainingCredits），
  # 个人版订阅没有席位，接口只回 {"Success": true} 而没有 Data —— 它读不出本机这份套餐的百分比。
  # 控制台那条是唯一读出过数字的路径（81.4% of 200000 Credits），所以排第一；OpenAPI 留着，
  # 等这个账号变成团队席位形态时它自然能给出读数。
  [[route.quota_query]]
  id = "console-data-gateway"
  kind = "script"
  method = "GET"
  url = "https://cs-data.qianwenai.com/data/api.json"
  auth = "cookie"
  auth_env = "QWEN_CONSOLE_COOKIE"
  dashboard = "https://platform-home.qianwenai.com/analytics/token-plan/individual"
  unit = "percent-left"
  note = """
    个人版 Token Plan 唯一的读数来源：用控制台会话（cookie）读数据网关，脚本自己取 sec_token。
    会话有寿命：2026-11-15 09:15 过期过一次，读数停摆、provider 被池子判成「读不到」。
    过期是「缺失」不是 0；重取 cookie 见 @skill(providers) 的 §4b（从那台已登录的浏览器里拿）。
    墙钟也是这件事的一部分：服务端给 reader 的护栏是 10 秒（crates/server/src/quota.rs 的
    READER_TIMEOUT），超时被杀就等于「没答」，池子随即落到下一条读不出个人版的 OpenAPI 上，
    报告里的失败成了「no seat with a readable share」。2026-11-17 三个网关调用还是串行，实测
    9-12 秒（info.json 2.0 + usage 2.4 + quota-config 3.2 + subscription 3.2）；改成三个并发后
    实测 4.9/5.3/5.8 秒。加任何一次串行往返之前先算这笔账。
    这两条读取都**不走**机器上的 HTTP(S)_PROXY：控制台与网关都是国内直连的域名。2026-11-18 实测
    代理（127.0.0.1:10793，以及服务端继承的 7897）对**所有** https 主机都超时，连 baidu 都是
    12 秒不通，而直连三个域名都是 200/0.1-0.3 秒；经代理读一次就是 10 秒被护栏杀成「没答」。
    所以 qwen.py / qwen_subscription.py 用 contract.direct_transport（ProxyHandler({})），
    直连后实测 1.0 / 0.7 秒。别把这两条改回默认 transport，除非那台机器的代理确实能通。
  """
  script = "providers/qwen.py"
  script_env = "QWEN_CONSOLE_COOKIE"

  [[route.quota_query]]
  id = "openapi-subscription-stats"
  kind = "script"
  method = "GET"
  url = "https://modelstudio.cn-beijing.aliyuncs.com/tokenplan/subscription/stats"
  auth = "access-key"
  auth_env = "ALIBABA_CLOUD_ACCESS_KEY_ID"
  unit = "percent-left"
  source = "https://help.aliyun.com/zh/model-studio/get-subscription-stats"
  note = """
    凭据从 ALIBABA_CLOUD_ACCESS_KEY_ID / ALIBABA_CLOUD_ACCESS_KEY_SECRET 读，
    或者 ~/.agents/keys.toml 里的 qwen-accesskey = "<id>:<secret>"（不进 git）。
    script_env 只是让 harness 把模型 key 放进一个没人读的变量，别改成本脚本真读的名字。
    已验证：签名实现对官方文档给的固定示例复现出同一个 Signature；
    假 key 打到端点回 InvalidAccessKeyId.NotFound（说明请求结构与路径被网关接受）。
    2026-11-15 实测（AccessKey 已配好、RAM 用户已授权 AliyunModelStudioReadOnlyAccess）：
    签名与鉴权都通过，但**个人版订阅的这个接口只回 `{"Success": true}`，没有 Data** ——
    它统计的是「席位」（standard/pro/max 席位与 SeatCredits），个人版没有席位，所以读不出百分比。
    结论：GetSubscriptionStats 覆盖团队席位，不覆盖个人版 Token Plan；读得出数字的是排在它前面的
    控制台 Cookie 读取（providers/qwen.py，早已恢复：2026-11-17 读到 63.8% of 200000 Credits）。
    别拿这个端点替代那条 —— 本账号变成团队席位形态之前它只回 Success。
  """
  script = "providers/qwen_subscription.py"
  script_env = "QWEN_TOKEN_PLAN_KEY"


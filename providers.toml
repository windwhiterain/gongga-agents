# 字段里的 source 记录**实际查证来源**，retrieved 是查证日期；标 unverified 的表示本机
# 探测和官方文档都没拿到，值来自网关在售目录，不要当合同价用。

schema = 1
updated = "2026-11-01"
timezone = "Asia/Shanghai"

# ---------------------------------------------------------------------------
# 分时计费：词汇表与算法
# ---------------------------------------------------------------------------
# 具体价格写在每个模型的 `[provider.model.price]` 和它的 `[[...price.band]]` 里
# （`band` 就是这个时段的价，固定的直接写死）。这里只定义那些价格表引用的**日子**，
# 以及可选的实时计算脚本。
#
# ## 一句话对照（全部北京时间）
#
#   DeepSeek 官方   高峰 09:00-12:00 + 14:00-18:00，周一至周五，**排除法定节假日**；
#                   调休上班的周末按空闲价。四家规则里只有它带节假日例外。
#   阿里百炼         忙时 08:00-22:00，**每天连续、含节假日**；闲时 22:00-次日 08:00。
#   腾讯 TokenHub   DeepSeek 系按 09:00-12:00 + 14:00-18:00 周一至周五；hy4/hy3 平价无分段。
#   千问 Token Plan 夜间 22:00-08:00 是**扣量系数**（Qwen 系 0.4×、DeepSeek 系 0.5×），不是标价打折。
#   MiMo Token Plan 夜间 00:00-08:00 扣量系数 0.8×。
#   MiniMax / Kimi  没有任何峰谷机制。
#
# ## 五个词的意思（`price.band.days` 只允许用这几个）
#
#   workday          周一至周五，且不是法定节假日、也不是放假调休
#   weekend          周六或周日，且不是调休上班日
#   holiday          法定节假日（国务院《放假办法》列的那几天，**不含连休补休**）
#   rest_day         放假调休 / 连休，但不是法定节假日（例如春节假期的其余几天）
#   makeup_workday   调休上班日（某个周六周日要上班；DeepSeek 把它算空闲价）
#
# "法定节假日"和"连休"必须分开：2026-02-15（春节假期第一天）不是法定节假日，
# 2026-01-02（元旦补休）也不是。把两者混在一起，高峰价就会在错误的日子生效。
#
# 这些日子逐年变化，写死在 roster 里必然过期，所以**没有**把日历表放在这里。
# 需要知道"现在是不是高峰、现在什么价"时，用下面的脚本：
#
#     python providers/price.py --provider deepseek-official --model deepseek-flash
#
# 它把 chinese-days 的年度数据缓存在 `~/.agents/cache/`（30 天），法定节假日的日期写在
# `providers/statutory.toml` 里（国务院每年发一次通知，日期固定），两者合起来算出现在落在
# 哪个 band。不联网也能用：`--offline` 只按周几判断，结果的 `approximate` 会说明这一点。

# ---------------------------------------------------------------------------
# 缓存：保留时间与存储费
# ---------------------------------------------------------------------------
# 前缀缓存省的是输入费，但它**会过期**。过期时间由厂商定，且大多写着"不保证"，
# 所以它属于 provider 级的事实，写在 `[[provider]]` 下，不是写在某个模型的价格里：
#
#   cache_ttl                  保留多久，用厂商自己的说法（"5 分钟，命中即续期"）
#   cache_ttl_note             它没说的那一半：写入怎么收费、能不能续期、存储怎么算
#   cache_ttl_source           查证来源；cache_ttl_retrieved 是查证日期
#   cache_ttl_estimate         拿来做规划的那个数 —— 官方不给的时候也要有，可以带"约"
#   cache_ttl_estimate_basis   community（第三方实测/横评）| inferred（按官方机制推）| guess（纯猜）
#   cache_ttl_estimate_source  估计的出处；纯猜的写"来源是猜的"并说清怎么猜的
#
# 这两层必须分开写，因为它们的用途不同：`cache_ttl` 回答"厂商承诺了什么"，只有官方能填；
# `cache_ttl_estimate` 回答"我该按多少秒去做超时/重发/前缀稳定性"，宁可是猜的也要有个数。
# 官方没公布时 `cache_ttl` 写 `unverified —— ...`，估计值照填 —— 留空等于没有这个信息。
#
# 价格那一侧沿用 `[provider.model.price]` 的字段：
#
#   cache_read            命中价（各家都收）
#   cache_write           写一次的价（显式缓存才收；0.00 常是"限时免费"）
#   cache_write_5m/1h     同一件事按 TTL 分档（Kimi K3 系）
#   cache_read_explicit   显式缓存命中价，与隐式分开记（阿里百炼）
#   cache_storage         存储价，**按小时**计，所以配 `cache_storage_unit`。
#                         方舟 0.017、智谱 0.00 都是"元/百万 token/小时"，
#                         单位写在 `unit = "per_1m_tokens"` 里的那个数不带时间。
#
# 现在只有方舟与智谱的价目表带存储项（都是"元/百万 token/小时"）；其余各家的价格表里没有
# 这一栏，所以那些模型不写 cache_storage —— 没写不等于免费，只等于没人公布。


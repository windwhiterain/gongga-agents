  concurrency_limit = 2500
  retired_ids = ["deepseek-chat", "deepseek-reasoner", "deepseek-v4-flash", "deepseek-v4-flash-vision-exp"]
  retired_note = "chat/reasoner 于 2026-07-24 下线；v4-flash 与 vision-exp 仍接受但已退役，转发到 V4.1-Flash"

  reasoning_levels = ["none", "low", "high", "max"]
  reasoning_default = "high"
  reasoning_field = { openai = "thinking{type} + reasoning_effort", anthropic = "reasoning.effort", responses = "reasoning.effort" }
  reasoning_mapping = { minimal = "low", low = "low", medium = "high", high = "high", xhigh = "high", max = "max", ultra = "max" }
  concurrency_limit = 2500
  retired_ids = ["deepseek-chat", "deepseek-reasoner", "deepseek-v4-flash", "deepseek-v4-flash-vision-exp"]

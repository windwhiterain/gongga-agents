  source = "https://platform.minimax.cn/docs/m-plan/faq"
  conflicting_sources = "模型表与 API 参考页都没有这个端点，只有 M Plan FAQ 写；本机脚本 providers/minimax.py 正在用它，且能跑出读数，所以按可用收录。"
  note = """
    必须是 M Plan 订阅 key，按量付费 key 返回 base_resp.status_code 1004/2049。
    字段名来自官方 CLI 源码而非文档；current_interval_usage_count 这个字段名有坑——
    它装的是**剩余**不是已用，used = total - usage_count。
  """

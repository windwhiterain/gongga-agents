# ---------------------------------------------------------------------------
# 阿里百炼（Qwen）：模型事实一份，两条接入面 —— 个人 Token Plan 与 DashScope 按量
# ---------------------------------------------------------------------------
# 同一个 qwen3.8-max 在两条面上是同一个模型：上下文、思考档位、思考预算、参数量都一样，
# 差的是计费（Credits vs 按量）与缓存单价。原先按接入面各记一份，按量那份没写的几项
# （reasoning_levels / thinking_budget_max）不是"不支持"，只是当时没抄 —— 现在写在
# [[model]] 上一次，两条面一起读到，也就一起被校验。
# 套餐面还有一条"preview 下线后按 max 计 Credits"的目录事实，那是这条路的账，留在 serving 上。

[[model]]
id = "qwen4-max-preview"
name = "Qwen 4 Max（预览版）"
tier = "sota"
context = 1000000
max_input = 991808                     # 非思考（reasoning_effort=none）；默认思考模式 983616
max_output = 393216                    # 官方《文本生成与视觉理解》：393,216（思考+输出）
modalities = ["text", "image", "video"]
thinking_budget_max = 262144
reasoning_levels = ["none", "low", "medium", "high", "xhigh", "max"]
reasoning_note = "取值集合与上限来自本机实测：reasoning_effort 传 bogus 时接口回 'must be one of: none/off/minimal/low/medium/high/xhigh/max'；thinking_budget 传 300000 回 'not greater than 262144'。官方文档（2026-11-11 那版）还没写 qwen4 的 effort→预算映射，所以这里不填 reasoning_mapping，也别把 qwen3.8 的 4096/16384/262144 直接套过来。"
note = """
预览版：Token Plan 独占（DashScope 按量目录没有它），2026-11-11 10:00 至 2026-11-25 24:00，预览结束后下线。
官方别名 qwen4.0-max-preview，两个 id 都能调，账单按别名显示 —— 本机 2026-11-11 实测，返回的 model 就是 qwen4.0-max-preview。
官方「选择模型」把它放在效果优先位（复杂推理与编程），视觉理解、Function Calling、内置工具、结构化输出都标支持。
价格：官方定价页 2026-11-09 那版还没有 qwen4 一行，预览期只按 Credits 计量，没有每百万 Token 的标价可写 —— 这一块先照 qwen3.8-max 抄一份占位价（2026-11-11 按要求填），note 里已标「未核实」，正式价出来必须替换。
活动口径两处：团队版文档写「限时 Credits 2 折（等于 5 倍用量），每晚 22:00-次日 08:00 再 2 折，即原标准 0.4 折」；新闻口径是「限时 2 折，新用户再叠加 5 折，最低 1 折」。等正式版定价页出来再补数字。
参数量官方未公布，故不写 [model.params]。
来源：上下文档 https://help.aliyun.com/zh/model-studio/text-generation-model/ 、预览期与折扣 https://help.aliyun.com/zh/model-studio/token-plan-team-overview （均 2026-11-11 那版）；能力清单 https://help.aliyun.com/zh/model-studio/models （2026-11-11）。

输入上限（2026-11-17 本机套餐 key 实测，超长请求被拒时接口自报）：默认思考模式 `Range of input length should be [1, 983616]`，`reasoning_effort=none` 时 `[1, 991808]` —— 与正式版 qwen4-max / qwen3.8-max 同数。两个都比 `context` 小，长会话真正撞的是这两个数，不是 1M：lichen-vm/impl/mentor/2 就在 983964 输入上撞了 983616 这条。
"""

[[model]]
id = "qwen4-max"
name = "Qwen 4 Max"
tier = "sota"
context = 1000000
max_input = 991808                     # 非思考；思考模式 983616
max_output = 262144                    # 思考 + 最终答案合计；关思考时 131072
modalities = ["text", "image", "video"]
thinking_budget_max = 262144
reasoning_levels = ["low", "high", "xhigh"]
reasoning_default = "high"
reasoning_mapping = { minimal = "low", medium = "high", max = "xhigh" }
reasoning_note = "档位与默认值来自官方《Latest model: Qwen4-Max》(2026-11-17)：low / high / xhigh，默认 high，thinking_budget 默认 131072；minimal→low、medium→high、max→xhigh。本机套餐 key 2026-11-17 传 bogus 实测接口仍收 'none/off/minimal/low/medium/high/xhigh/max' 全集，thinking_budget 传 300000 回 'not greater than 262144'——接口接受别名比官方三档宽，映射按官方口径记，别把 extra 档当新能力。none/off 是关思考，不是更强的档。"
note = """
正式版 2026-11-16 上线，接替 11-11 的 qwen4-max-preview（preview 11-25 24:00 下线）。
wire id 就是 qwen4-max，本机 2026-11-17 在套餐面真实调用返回的 model 也是 qwen4-max，**没有** qwen4.0-max 这个别名 —— preview 才有 qwen4.0-max-preview 别名，别互相套。
与 preview 的两处硬差异（迁移时要重新核对长输出和思考档）：思考+答案合计上限 393216 → 262144，默认档 xhigh → high。
官方支持文本/图像/视频输入、流式、Function Calling、并行工具、结构化输出、显式与隐式缓存、CoT Summary；**不支持** Batch 推理、微调与模型部署，所以这条 serving 不写 batch 价。
参数量（正式版官方公布，preview 那条当时写"未公布"）：2.4T backbone、每 token 激活 71B，另有 328B N-gram Embedding。
来源：规格 https://docs.qwencloud.com/developer-guides/getting-started/latest-model 、定价 https://docs.qwencloud.com/developer-guides/getting-started/pricing 、发布 https://qwen.ai/blog?id=qwen4-max （均 2026-11-17 取）。
"""


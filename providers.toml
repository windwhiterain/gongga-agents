  retrieved = "2026-10-31"

  [provider.model.price]
  currency = "CNY"
  unit = "per_1m_tokens"
  input = 2.00              # cache miss
  output = 8.00
  cache_read = 0.04
  price_usd = { input = 0.30, output = 1.20, cache_read = 0.006 }
  # 价目表只有这三栏；写入与存储没有列价，估计不计费（推断，未确认）。
  # Peak first: it is the narrow exception, and a band list is read in order.
  # Its prices are the base ones above, so it states none of its own.
  [[provider.model.price.band]]
  id = "peak"
  hours = [{ start = "09:00", end = "12:00" }, { start = "14:00", end = "18:00" }]
  days = ["workday"]
  note = "官方原文：北京时间周一至周五（不含中国法定节假日）9:00-12:00、14:00-18:00 为高峰时段；其余全部时段（含工作日夜间、周末、法定节假日）按空闲价"
  source = "https://api-docs.deepseek.com/zh-cn/quick_start/pricing/"
  retrieved = "2026-10-22"
  # The catch-all: no `days` and no `hours` means "whatever the bands above did not
  # take". Declaring only the weekend here would leave a weekday night at the base
  # price, which is the peak price -- the opposite of what the provider charges.
    [[provider.model.price.band]]
    id = "offpeak"
    note = "除高峰时段以外的一切时间：工作日 18:00-次日 09:00、12:00-14:00，以及周末与法定节假日全天"
    input = 1.00
    output = 4.00
    cache_read = 0.02
    price_usd = { input = 0.15, output = 0.60, cache_read = 0.003 }
    source = "https://api-docs.deepseek.com/zh-cn/quick_start/pricing/"
    retrieved = "2026-10-22"


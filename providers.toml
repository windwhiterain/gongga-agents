# ---------------------------------------------------------------------------
# 百度千帆（Qianfan）：模型事实一份，两条接入面各一条 route
# ---------------------------------------------------------------------------
# 千帆上除了 ERNIE 全系还有一大批托管的三方模型（DeepSeek / GLM / Kimi / Qwen / MiMo）。
# 套餐面按官方在售清单登记：已有事实的复用 `[[model]]`，只写一条 `[[serving]]` 并用
# `wire_id` 记千帆的 model 参数；套餐特有、别家没有的（ERNIE-Light-DT-1.0、Kimi-K2.6）
# 在这里新建事实。按量面仍只登记文心 5.5 —— 本机没有那把 key，端点与价都是文档口径。
#
# 这一组是三层写法：`[[model]]` 是模型事实，只写一次；`[[route]]` 是一条接入面（端点、
# 密钥变量、缓存、额度查询）；`[[serving]]` 说某条 route 卖它、卖多少钱、线上叫什么名。
# 同一个模型在按量面和套餐面上不再抄两遍，换的只是 route 与那一档价。

[[model]]
id = "ernie-5.5-flash-preview"
name = "ERNIE 5.5 Flash Preview（文心 5.5）"
tier = "flash"
context = 1000000
max_input = 1000000
max_output = 1000000
modalities = ["text"]
concurrency_limit = 300
# 思考只能开、强度只有一档：别的档位一律映射回 high（平台自己也把 low / medium 映射成 high）。
reasoning_levels = ["high"]
reasoning_default = "high"
reasoning_field = "thinking{type} + reasoning_effort"
reasoning_mapping = { minimal = "high", low = "high", medium = "high", high = "high", xhigh = "high", max = "high", ultra = "high" }
reasoning_note = """官方口径：支持清单把 ernie-5.5-flash-preview 列为『仅支持开启，不支持关闭』，reasoning_effort 默认 high 且『不支持调整』。思维链走 reasoning_content（chat 面）/ reasoning item（responses 面），**计入输出预算**（ERNIE 系不支持 thinking_budget），压得太紧会拿到 finish_reason=length。
但『开着』不等于『会想』：2026-11-15 本机实测（套餐面 /v2/tokenplan/personal），reasoning_tokens 经常是 0，且不报错、不是关闭 —— 是它自己判定这一步不值得想。比例与工具数量、是否已有工具往返相关：同一道题，9 个工具且已有一次 function_call/function_call_output → 1/5 次带思考；9 个工具、无工具历史 → 5/5；1 个工具 + 有历史 → 4/5。上下文大小不解释这件事（131k 字符的 read index 当 user 消息发进去照样想）。连续工具轮的 agent 循环里因此基本全程 0：实测一个 148 步的会话共 208 次请求，只有第 1 次带思维链（372 token）。
选型后果：把它当『有 CoT 可看』的模型用会失望；想要稳定可读的思维链，工具多的场景别选它。"""
note = "2026-11-11 发布的文心最新基础模型预览版（首个后训练版本），官方自己说是中间检查点、训练未结束，正式版还会变；权重承诺 11 月 25 日前开源于 Apache 2.0。纯文本（无视觉）。输出上限两处口径不同：模型列表写 1M，控制台模型卡写『输出默认 64K』—— 即不传 max_tokens 时按 64K 截。最大输入与最大输出都写 1M，两者相加显然超过 1M，官方没解释这个重叠。"


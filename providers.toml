# ---------------------------------------------------------------------------
# 与 DSH 的关系
# ---------------------------------------------------------------------------
# 这个文件目前是**只读事实源**，DSH 不读它。运行中的配置仍在
# ~/.dsh/profiles/<profile>/cordis.patch.yml 的 llm-pi-ai / agent-default-model 行里。
#
# 要接线的话有三个坑，先记在这里：
#   1. patch 是整行替换 config，不是深合并 —— 从这里生成 providers 必须给全量，
#      否则 profile 里剩下的 provider 会被整份顶掉。
#   2. TOML 没有 eval 通道；home 层只能用 `!!js`，得在表达式里手写一个 TOML 解析
#      （或改成 JSON / YAML）。
#   3. Models 页面写的是 profile 层那一行，它和 home 层会互相覆盖。
#      在这两件事解决前，只有人手改这个文件。
[dsh]
consumed = false
credential_file = "C:/Users/17124/.dsh/.credentials.yaml"
patch_layer_profile = "C:/Users/17124/.dsh/profiles/web/cordis.patch.yml"
patch_layer_home = "C:/Users/17124/.dsh/cordis.patch.yml"
row_id = "llm-pi-ai"
default_model_row = "agent-default-model"
# 每个 provider 的 quota_query.script 是**相对本文件所在目录**的路径：脚本都在 ~/.agents/providers/
# 下，解释器是 python（`python ~/.agents/providers/<name>.py`）。providers/probe.py 离线跑全部解析器。
quota_plugin = "dsh-llm-quota-retry"

# 换密钥时这里和 .dsh/.credentials.yaml 的 refs 要同步改，否则两边指向两把不同的 key。
[maintenance]
rotate_keys_with = ["C:/Users/17124/.dsh/.credentials.yaml"]
last_verified = "2026-10-31"
verify = [
  "curl 每个 provider.catalog 端点，确认返回的模型 id 仍在本文件里",
  "curl 每个 quota_query.url，确认返回体字段名未变",
  "对比网关在售目录的命令行费用表与本文件 price 是否漂移",
]

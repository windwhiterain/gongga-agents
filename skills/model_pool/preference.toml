# 这台机器鼓励用哪些模型，以及三档各抽多少。
#
# 倍率是"用户更希望 agent 用这个"的程度，不是模型好坏：`1.0` 是正常候选，
# `2.0` 是"能用就用它"，`0.5` 是"没得选才用"。**倍率里没有的模型默认为 0**，
# 也就是不抽——清单就是白名单，加一行才算启用。
#
# 改这里不用重新编译：下一次 pick 就读到。

# 档位对应的是**活**，不是价格：
#   flash  search / explore / investigate / implement
#   pro    hard implement / review
#   sota   plan / core review
#   test   只用来测 harness，默认不抽
# 先抽档，再在档里按"剩余额度 × 倍率"抽模型。派活时按活选档（`--tier`），
# 不点档才落到下面的权重。`test` 默认 0：要看它得显式 --tier test。
flash = 0.60
pro = 0.35
sota = 0.05
test = 0.0

[model]
# DeepSeek V4.1 Flash
"deepseek-official/deepseek-flash" = 1.0
# MiniMax M3.1 Flash
"minimax-cn/MiniMax-M3.1-Flash" = 1.0
# Kimi K3.1 Pro
"kimi-coding/k3.1-pro" = 1.0
# Qwen 3.8 Max（Token Plan 与 DashScope 是同一模型的两条路，两个都开）
"qwen-token-plan/qwen3.8-max" = 1.0
"qwen-dashscope/qwen3.8-max" = 1.0
# Qwen 3.8 Flash
"qwen-token-plan/qwen3.8-flash" = 1.0
"qwen-dashscope/qwen3.8-flash" = 1.0
# 腾讯混元 Hy4 Preview
"tencent-tokenhub/hy4-preview" = 1.0
# Kimi K2.8 Preview：API id 是 `kimi-for-coding`（2026-09-11 官方原地升级，id 不变）
"kimi-coding/kimi-for-coding" = 1.0
# 智谱 GLM（还没有 key，有 key 就自动参与抽取）
"zhipu/glm-5.3" = 1.0
"zhipu/glm-5.3-flash" = 1.0
"zhipu/glm-5.2" = 1.0
# 字节 Doubao Seed（同上）
"bytedance-ark/doubao-seed-2-1-pro-260915" = 1.0
"bytedance-ark/doubao-seed-evolving" = 1.0
"bytedance-ark/doubao-seed-2-1-lite-260915" = 1.0

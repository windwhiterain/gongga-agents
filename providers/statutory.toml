# 法定节假日的日期。**这是数据，不是逻辑**：国务院每年发一次通知，日期固定，
# 所以直接写在这里；`price.py` 读它，加上 chinese-days 的放假/调休表算出某个日子
# 到底属于 `holiday` 还是 `rest_day`。
#
# 为什么需要单独一张表：区分"法定节假日"和"连休补休"是 DeepSeek 高峰价的判据——
# 官方写的是"周一至周五（不含中国法定节假日）"。2026-02-15（春节假期第一天）是连休
# 但不是法定节假日；把它和法定日混在一起，高峰价就会在错误的日子生效。
#
# 新增一年：国务院办公厅的通知发布后照抄 `dates`，`source` 写通知链接，`retrieved`
# 写查证日期。没有那一年时 `price.py` 会退回按周末判断，并在结果的 `approximate` 字段说明。

schema = 1
updated = "2026-11-01"

  [[year]]
  year = 2026
  # 元旦 1 天、春节 4 天、清明 1 天、劳动节 2 天、端午 1 天、中秋 1 天、国庆 3 天 = 13 天
  dates = [
    "2026-01-01",
    "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19",
    "2026-04-04",
    "2026-05-01", "2026-05-02",
    "2026-06-19",
    "2026-09-25",
    "2026-10-01", "2026-10-02", "2026-10-03",
  ]
  makeup_workdays = [
    "2026-01-04", "2026-02-14", "2026-02-28", "2026-05-09", "2026-09-20", "2026-10-10",
  ]
  breakdown = { "元旦" = ["2026-01-01"], "春节" = ["2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19"], "清明" = ["2026-04-04"], "劳动节" = ["2026-05-01", "2026-05-02"], "端午" = ["2026-06-19"], "中秋" = ["2026-09-25"], "国庆" = ["2026-10-01", "2026-10-02", "2026-10-03"] }
  source = "https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm"
  retrieved = "2026-10-22"

  [[year]]
  year = 2027
  # 只有可推算的锚点：元旦固定 1 月 1 日。春节、清明的公历日期按农历推算（除夕
  # 2027-02-05，初一至初三 2027-02-06..08），国务院通知发布前不是官方口径，所以
  # 不算进 `dates`——宁可退回周末判断，也不要给出一个假的高峰价。
  dates = ["2027-01-01"]
